
name: Build and publish Ahl Al-Quran APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk AhlAlQuran.apk

      - name: Keep backup in Actions
        uses: actions/upload-artifact@v4
        with:
          name: AhlAlQuran-debug-APK
          path: AhlAlQuran.apk
          if-no-files-found: error

      - name: Publish a direct-download test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" AhlAlQuran.apk \
            --target "$GITHUB_SHA" \
            --title "Ahl Al-Quran test APK #${GITHUB_RUN_NUMBER}" \
            --notes "Experimental debug APK. For local testing only; no live cloud service is included. Do not use real student data." \
            --prerelease \
            --latest=false
