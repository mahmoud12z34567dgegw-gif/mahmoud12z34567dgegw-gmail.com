plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ahlquran.academy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ahlquran.academy'
        minSdk 29
        targetSdk 34
        versionCode 6
        versionName '1.4-meetings'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
