plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ahlquran.academy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ahlquran.academy'
        minSdk 29
        targetSdk 34
        versionCode 7
        versionName '1.5-audio-rooms'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}


dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
